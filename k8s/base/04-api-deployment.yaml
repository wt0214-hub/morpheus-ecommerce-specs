apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-api
  namespace: ecom-05
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-api
  template:
    metadata:
      labels:
        app: ecommerce-api
    spec:
      containers:
      - name: api
        image: python:3.9-alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install redis
          python /app/server.py
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: code-volume
          mountPath: /app
      volumes:
      - name: code-volume
        configMap:
          name: ecommerce-api-code
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-api-service
  namespace: ecom-05
spec:
  selector:
    app: ecommerce-api
  ports:
  - port: 8080
    targetPort: 8080
